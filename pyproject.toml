[project]
name = "mcp-hedgedoc"
version = "0.1.0"
description = "MCP server for HedgeDoc 1.x -- read notes and create new ones through a single service-account session, with a native read-only mode for the ro/rw variant split."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
    { name = "Lucas Bourneuf" },
]
dependencies = [
    "fastmcp==3.4.2",
    "fastmcp-slim[client,server]==3.4.2",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "responses>=0.25.0",
]

[project.scripts]
mcp-hedgedoc = "mcp_hedgedoc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
